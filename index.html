<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิดเงิน - ร้านแม่อัมพร</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/promptpay-qr@0.5.0/dist/promptpay-qr.min.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f4f6f9; }
        .dish-card { cursor: pointer; transition: 0.15s; }
        .dish-card:active { transform: scale(0.95); }
        .badge-cat { font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container py-3">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0 fw-bold text-danger">🍜 ร้านแม่อัมพร</h3>
        <button class="btn btn-outline-secondary btn-sm" onclick="toggleAdminModal()">⚙️ เพิ่มเมนู (Admin)</button>
    </div>

    <!-- รายการประเภทจาน / เมนูอาหาร -->
    <div class="row g-2 mb-3" id="menu-container">
        <div class="text-center text-muted">กำลังโหลดรายการอาหาร...</div>
    </div>

    <!-- สรุปรายการในโต๊ะ -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h5 class="card-title fw-bold">รายการอาหารที่สั่ง</h5>
            <div id="order-items" class="mb-3"></div>
            <hr>
            <div class="d-flex justify-content-between fs-4 fw-bold">
                <span>รวมยอดโอน:</span>
                <span class="text-danger"><span id="total-amount">0</span> ฿</span>
            </div>
        </div>
    </div>

    <!-- ปุ่มคิดเงิน -->
    <div class="d-grid gap-2 mb-4">
        <button class="btn btn-success btn-lg py-3 fw-bold" onclick="processPayment()">💳 คิดเงิน / แสดง QR Code</button>
        <button class="btn btn-outline-danger" onclick="clearCart()">ล้างรายการ</button>
    </div>

    <!-- Modal แสดง PromptPay QR Code ล็อกยอดเงิน -->
    <div class="modal fade" id="paymentModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">สแกนจ่ายเงิน (ร้านแม่อัมพร)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-2">เปิดแอปธนาคารแล้วสแกน QR Code ด้านล่าง</p>
                    <canvas id="qr-canvas" class="mb-3 border p-2 bg-white rounded shadow-sm"></canvas>
                    <h3 class="fw-bold text-danger">ยอดโอน: <span id="pay-amount">0</span> บาท</h3>
                    <p class="text-success small mt-2">✓ บันทึกประวัติลง Google Sheets เรียบร้อยแล้ว</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary w-100 py-2" data-bs-dismiss="modal" onclick="clearCart()">ปิดหน้าจอ / รับโต๊ะถัดไป</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Admin เพิ่มเมนู -->
    <div class="modal fade" id="adminModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">เพิ่มรายการอาหาร / ประเภทจาน</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-menu-form">
                        <div class="mb-2">
                            <label class="form-label">ประเภทจาน / หมวดหมู่</label>
                            <input type="text" id="adm-cat" class="form-control" placeholder="เช่น จานชมพู, ถ้วยเล็ก" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">ชื่อรายการ</label>
                            <input type="text" id="adm-name" class="form-control" placeholder="เช่น ก๋วยเตี๋ยว พิเศษ" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ราคา (บาท)</label>
                            <input type="number" id="adm-price" class="form-control" placeholder="60" required>
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="submitNewMenu()">+ บันทึกรายการใหม่</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxcjIGASjvsbbWSlpEEKF7uUZ5p5qcd783VYzxB8N5QyWZ24GpvlblqyVGLFl7dP3eW/exec"; // นำ Web App URL จาก Apps Script มาวางตรงนี้
    const PROMPTPAY_ID = "0993321144";        // เบอร์โทรศัพท์ PromptPay ของร้านแม่อัมพร

    let menuData = [];
    let cart = {};
    let currentTotal = 0;

    window.onload = () => {
        loadMenu();
    };

    function loadMenu() {
        fetch(`${GAS_URL}?action=getMenu`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    menuData = res.data;
                    renderMenu();
                }
            });
    }

    function renderMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';
        menuData.forEach(item => {
            container.innerHTML += `
                <div class="col-6 col-md-4">
                    <div class="card dish-card p-3 shadow-sm text-center" onclick="addToCart('${item.id}')">
                        <span class="badge bg-secondary badge-cat mb-1">${item.category}</span>
                        <div class="fw-bold fs-6">${item.name}</div>
                        <div class="text-danger fw-bold mt-1">${item.price} ฿</div>
                    </div>
                </div>
            `;
        });
    }

    function addToCart(id) {
        if(!cart[id]) cart[id] = 0;
        cart[id]++;
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const container = document.getElementById('order-items');
        container.innerHTML = '';
        currentTotal = 0;

        Object.keys(cart).forEach(id => {
            const item = menuData.find(m => m.id === id);
            if(item && cart[id] > 0) {
                const itemTotal = item.price * cart[id];
                currentTotal += itemTotal;
                container.innerHTML += `
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <div><b>${item.name}</b> <small class="text-muted">(${item.category})</small> x ${cart[id]}</div>
                        <div>
                            <span class="fw-bold">${itemTotal} ฿</span>
                            <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeFromCart('${id}')">-</button>
                        </div>
                    </div>
                `;
            }
        });

        document.getElementById('total-amount').innerText = currentTotal;
    }

    function removeFromCart(id) {
        if(cart[id]) {
            cart[id]--;
            if(cart[id] === 0) delete cart[id];
        }
        updateCartDisplay();
    }

    function clearCart() {
        cart = {};
        updateCartDisplay();
    }

    // ประมวลผลสร้าง QR Code พร้อมระบุยอดเงิน และบันทึกข้อมูล
    function processPayment() {
        if(currentTotal <= 0) return alert('กรุณาเลือกรายการก่อนครับ');

        // 1. สร้าง QR Code PromptPay ที่ล็อกยอดเงินไว้
        document.getElementById('pay-amount').innerText = currentTotal;
        const payload = promptpayQr(PROMPTPAY_ID, { amount: currentTotal });
        QRCode.toCanvas(document.getElementById('qr-canvas'), payload, { width: 220 });

        // 2. แสดง Pop-up QR Code
        const modal = new bootstrap.Modal(document.getElementById('paymentModal'));
        modal.show();

        // 3. ส่งข้อมูลบันทึกลง Google Sheets ในพื้นหลังทันที
        saveOrderToSheet();
    }

    function saveOrderToSheet() {
        const orderItems = Object.keys(cart).map(id => {
            const item = menuData.find(m => m.id === id);
            return { name: `${item.name} [${item.category}]`, qty: cart[id] };
        });

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: "saveOrder",
                order: {
                    items: orderItems,
                    totalAmount: currentTotal
                }
            })
        });
    }

    function toggleAdminModal() {
        new bootstrap.Modal(document.getElementById('adminModal')).show();
    }

    function submitNewMenu() {
        const category = document.getElementById('adm-cat').value;
        const name = document.getElementById('adm-name').value;
        const price = document.getElementById('adm-price').value;

        if(!category || !name || !price) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: "updateMenu",
                menuItem: { category, name, price }
            })
        }).then(() => {
            alert('เพิ่มรายการเรียบร้อย');
            bootstrap.Modal.getInstance(document.getElementById('adminModal')).hide();
            document.getElementById('add-menu-form').reset();
            loadMenu();
        });
    }
</script>
</body>
</html>
