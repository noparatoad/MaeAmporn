<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิดเงิน - ร้านแม่อัมพร</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
    body { font-family: 'Kanit', sans-serif; background-color: #fff7ed; }

    /* การ์ดเมนู (ชาม/จาน) */
    .dish-card {
        cursor: pointer;
        transition: transform .15s, box-shadow .15s;
        border: 0;
        border-radius: 20px;
        min-height: 170px;
        color: #fff;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 14px 10px;
        box-shadow: 0 6px 14px rgba(0,0,0,.15);
    }
    .dish-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,.2); }
    .dish-card:active { transform: scale(0.95); }
    .dish-emoji { font-size: 2.6rem; line-height: 1; margin-bottom: 4px; }
    .dish-name  { font-size: 1.3rem; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .dish-cat   {
        font-size: .85rem; background: rgba(255,255,255,.3);
        padding: 2px 12px; border-radius: 50px; margin-bottom: 6px;
    }
    .dish-price {
        font-size: 1.6rem; font-weight: 800; color: #d62828;
        background: #fff; border-radius: 50px; padding: 0 16px; margin-top: 8px;
    }
    .dish-qty {
        position: absolute; top: 8px; right: 8px;
        background: #fff; color: #d62828; font-weight: 800;
        min-width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }

    /* ชื่อบัญชีใต้ QR */
    .account-box {
        background: #f1f8ff; border: 1px dashed #0d6efd;
        border-radius: 12px; padding: 8px 12px; margin-bottom: 10px;
    }
</style>
</head>
<body>

<div class="container py-3">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0 fw-bold text-danger">🍜 ร้านแม่อัมพร</h3>
        <button class="btn btn-outline-secondary btn-sm" onclick="toggleAdminModal()">⚙️ เพิ่มเมนู (Admin)</button>
    </div>

    <!-- รายการประเภทจาน / เมนูอาหาร -->
    <div class="row g-2 mb-3" id="menu-container">
        <div class="text-center text-muted">กำลังโหลดรายการอาหาร...</div>
    </div>

    <!-- สรุปรายการในโต๊ะ -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h5 class="card-title fw-bold">รายการอาหารที่สั่ง</h5>
            <div id="order-items" class="mb-3"></div>
            <hr>
            <div class="d-flex justify-content-between fs-4 fw-bold">
                <span>รวมยอดโอน:</span>
                <span class="text-danger"><span id="total-amount">0</span> ฿</span>
            </div>
        </div>
    </div>

    <!-- ปุ่มคิดเงิน -->
    <div class="d-grid gap-2 mb-4">
        <button class="btn btn-success btn-lg py-3 fw-bold" onclick="processPayment()">💳 คิดเงิน / แสดง QR Code</button>
        <button class="btn btn-outline-danger" onclick="clearCart()">ล้างรายการ</button>
    </div>

    <!-- Modal แสดง PromptPay QR Code ล็อกยอดเงิน -->
    <div class="modal fade" id="paymentModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">สแกนจ่ายเงิน (ร้านแม่อัมพร)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
    <p class="text-muted mb-2">เปิดแอปธนาคารแล้วสแกน QR Code ด้านล่าง</p>

    <div class="d-flex justify-content-center mb-2">
        <div id="qr-canvas" class="border p-2 bg-white rounded shadow-sm"></div>
    </div>

    <!-- ชื่อบัญชีให้ลูกค้าตรวจสอบ -->
    <div class="account-box">
        <div class="small text-muted">ตรวจสอบชื่อบัญชีก่อนโอน</div>
        <div class="fw-bold fs-5 text-primary">ชื่อบัญชี น.ส.เกวรินทร์ เอกสินิทธ์กุล</div>
    </div>

    <h3 class="fw-bold text-danger">ยอดโอน: <span id="pay-amount">0</span> บาท</h3>
    <p class="text-success small mt-2">✓ บันทึกประวัติลง Google Sheets เรียบร้อยแล้ว</p>
</div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary w-100 py-2" data-bs-dismiss="modal" onclick="clearCart()">ปิดหน้าจอ / รับโต๊ะถัดไป</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Admin เพิ่มเมนู -->
    <div class="modal fade" id="adminModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">เพิ่มรายการอาหาร / ประเภทจาน</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-menu-form">
                        <div class="mb-2">
                            <label class="form-label">ประเภทจาน / หมวดหมู่</label>
                            <input type="text" id="adm-cat" class="form-control" placeholder="เช่น จานชมพู, ถ้วยเล็ก" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">ชื่อรายการ</label>
                            <input type="text" id="adm-name" class="form-control" placeholder="เช่น ก๋วยเตี๋ยว พิเศษ" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ราคา (บาท)</label>
                            <input type="number" id="adm-price" class="form-control" placeholder="60" required>
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="submitNewMenu()">+ บันทึกรายการใหม่</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxcjIGASjvsbbWSlpEEKF7uUZ5p5qcd783VYzxB8N5QyWZ24GpvlblqyVGLFl7dP3eW/exec"; // นำ Web App URL จาก Apps Script มาวางตรงนี้
    const PROMPTPAY_ID = "0831595830";        // เบอร์โทรศัพท์ PromptPay ของร้านแม่อัมพร

    let menuData = [];
    let cart = {};
    let currentTotal = 0;
const COLOR_PALETTE = [
    'linear-gradient(135deg,#ff416c,#ff4b2b)', // แดง
    'linear-gradient(135deg,#f7971e,#ffb347)', // ส้ม
    'linear-gradient(135deg,#11998e,#38ef7d)', // เขียว
    'linear-gradient(135deg,#2193b0,#6dd5ed)', // ฟ้า
    'linear-gradient(135deg,#8e2de2,#c471ed)', // ม่วง
    'linear-gradient(135deg,#ec008c,#fc6767)', // ชมพู
    'linear-gradient(135deg,#f2994a,#f2c94c)'  // เหลือง
];
const EMOJIS = ['🍜','🍲','🥣','🍛','🍚','🥢'];
let categoryColors = {};

function getCategoryColor(cat) {
    if (!(cat in categoryColors)) {
        categoryColors[cat] = Object.keys(categoryColors).length % COLOR_PALETTE.length;
    }
    return COLOR_PALETTE[categoryColors[cat]];
}
    window.onload = () => {
        loadMenu();
    };

    function loadMenu() {
        fetch(`${GAS_URL}?action=getMenu`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    menuData = res.data;
                    renderMenu();
                }
            });
    }

    function renderMenu() {
    const container = document.getElementById('menu-container');
    container.innerHTML = '';
    menuData.forEach((item, i) => {
        const qty = cart[item.id] || 0;
        container.innerHTML += `
            <div class="col-6 col-md-4">
                <div class="dish-card" style="background:${getCategoryColor(item.category)}"
                     onclick="addToCart('${item.id}')">
                    ${qty > 0 ? `<div class="dish-qty">${qty}</div>` : ''}
                    <div class="dish-emoji">${EMOJIS[i % EMOJIS.length]}</div>
                    <div class="dish-cat">${item.category}</div>
                    <div class="dish-name">${item.name}</div>
                    <div class="dish-price">${item.price} ฿</div>
                </div>
            </div>
        `;
    });
}

    function addToCart(id) {
        if(!cart[id]) cart[id] = 0;
        cart[id]++;
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const container = document.getElementById('order-items');
        container.innerHTML = '';
        currentTotal = 0;

        Object.keys(cart).forEach(id => {
            const item = menuData.find(m => String(m.id) === String(id));
            if(item && cart[id] > 0) {
                const itemTotal = item.price * cart[id];
                currentTotal += itemTotal;
                container.innerHTML += `
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <div><b>${item.name}</b> <small class="text-muted">(${item.category})</small> x ${cart[id]}</div>
                        <div>
                            <span class="fw-bold">${itemTotal} ฿</span>
                            <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeFromCart('${id}')">-</button>
                        </div>
                    </div>
                `;
            }
        });

        document.getElementById('total-amount').innerText = currentTotal;
        renderMenu();   // <-- เพิ่มบรรทัดนี้
    }

    function removeFromCart(id) {
        if(cart[id]) {
            cart[id]--;
            if(cart[id] === 0) delete cart[id];
        }
        updateCartDisplay();
    }

    function clearCart() {
        cart = {};
        updateCartDisplay();
    }

    // ประมวลผลสร้าง QR Code พร้อมระบุยอดเงิน และบันทึกข้อมูล
    // ===== สร้าง PromptPay Payload (มาตรฐาน EMVCo) =====
function crc16(str) {
    let crc = 0xFFFF;
    for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
            crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
            crc &= 0xFFFF;
        }
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
}

function tlv(tag, value) {
    return tag + String(value.length).padStart(2, '0') + value;
}

function generatePromptPayPayload(phone, amount) {
    // แปลงเบอร์ 0993321144 -> 0066993321144
    let target = phone.replace(/\D/g, '');
    target = '0066' + target.replace(/^0/, '');

    const merchant = tlv('00', 'A000000677010111') + tlv('01', target);

    let payload =
        tlv('00', '01') +
        tlv('01', amount ? '12' : '11') +
        tlv('29', merchant) +
        tlv('58', 'TH') +
        tlv('53', '764');

    if (amount) payload += tlv('54', Number(amount).toFixed(2));

    payload += '6304';
    return payload + crc16(payload);
}

// ===== ประมวลผลชำระเงิน =====
function processPayment() {
    if (currentTotal <= 0) return alert('กรุณาเลือกรายการก่อนครับ');

    document.getElementById('pay-amount').innerText = currentTotal;

    // สร้าง QR
    const payload = generatePromptPayPayload(PROMPTPAY_ID, currentTotal);
    const qrBox = document.getElementById('qr-canvas');
    qrBox.innerHTML = '';
    new QRCode(qrBox, {
        text: payload,
        width: 260,
        height: 260,
        correctLevel: QRCode.CorrectLevel.M
    });

    // แสดง Modal
    const modal = new bootstrap.Modal(document.getElementById('paymentModal'));
    modal.show();

    // บันทึกลง Google Sheets (ถ้า error ก็ไม่กระทบการแสดง QR)
    try { saveOrderToSheet(); } catch (e) { console.error(e); }
}

    function saveOrderToSheet() {
        const orderItems = Object.keys(cart).map(id => {
            const item = menuData.find(m => String(m.id) === String(id));
            return { name: `${item.name} [${item.category}]`, qty: cart[id] };
        });

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: "saveOrder",
                order: {
                    items: orderItems,
                    totalAmount: currentTotal
                }
            })
        });
    }

    function toggleAdminModal() {
        new bootstrap.Modal(document.getElementById('adminModal')).show();
    }

    function submitNewMenu() {
        const category = document.getElementById('adm-cat').value;
        const name = document.getElementById('adm-name').value;
        const price = document.getElementById('adm-price').value;

        if(!category || !name || !price) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: "updateMenu",
                menuItem: { category, name, price }
            })
        }).then(() => {
            alert('เพิ่มรายการเรียบร้อย');
            bootstrap.Modal.getInstance(document.getElementById('adminModal')).hide();
            document.getElementById('add-menu-form').reset();
            loadMenu();
        });
    }
</script>
</body>
</html>
